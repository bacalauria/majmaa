<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>relay</title><script>
// TEMPORARY helper, approved by Kamel (2026-10-31), removed right after use: hands the video/cover files of the
// scheduled posts to the Facebook / YouTube Studio page that frames it (those pages cannot fetch files from other sites).
// Only files of this repository's temporary staging commit are served, and only to facebook.com / studio.youtube.com.
const OK=['https://www.facebook.com','https://studio.youtube.com'];
const B='https://api.github.com/repos/bacalauria/majmaa/contents/', REF='?ref=a3701f284e1e2d37d3af99909709465b4a09004b';
addEventListener('message',async e=>{if(!OK.includes(e.origin)||!e.data||!e.data.__majmaaReq) return;
 const p=String(e.data.path); if(!/^(v|t)\/[\w.-]+$|^(meta|yt)\.json$|^h\.js$/.test(p)) return;
 const b=await (await fetch(B+p+REF,{headers:{Accept:'application/vnd.github.raw'}})).blob(); const t=p.endsWith('.mp4')?'video/mp4':p.endsWith('.jpg')?'image/jpeg':p.endsWith('.srt')?'application/x-subrip':'text/plain';
 e.source.postMessage({__majmaa:1,name:p,file:new File([b],p.split('/').pop(),{type:t})},e.origin);});
for(const o of OK) try{parent.postMessage({__majmaa:1,ready:1},o);}catch(_){}
</script>
